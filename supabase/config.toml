# Supabase project config
# Run `supabase link --project-ref <ref>` to link this folder to your remote project.

project_id = "thaiid"

[functions.gemini-proxy]
# Authentication is enforced inside the function, not by this flag.
#
# Two reasons it is deliberately false:
#   1. Platform verify_jwt accepts the anon key, which is public and shipped in
#      the client bundle. It would not actually keep strangers out.
#   2. It rejects the browser's CORS preflight, which carries no Authorization
#      header, so the function becomes uncallable from the web app.
#
# Instead the handler resolves the bearer token with auth.getUser() and rejects
# anything that does not map to a real user. That is strictly stronger than the
# platform check. See supabase/functions/gemini-proxy/index.ts.
verify_jwt = false
